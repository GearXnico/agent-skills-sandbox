services:
  web:
    image: nginx:1.27
    volumes:
      - ./web:/usr/share/nginx/html:ro
    ports:
      - "80:80"

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/orders
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    depends_on: [db, redis]

  worker:
    build: ./worker
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/orders
      REDIS_URL: redis://redis:6379
      PAYMENT_API_KEY: hardcoded-payment-key
    depends_on: [redis]

  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql

  redis:
    image: redis:8
    ports:
      - "6379:6379"

volumes:
  db-data:
